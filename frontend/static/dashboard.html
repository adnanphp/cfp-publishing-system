<!DOCTYPE html>
<html>
<head>
    <title>CFP Static Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8">
    <h1 class="text-3xl font-bold mb-4">CFP System - Static Dashboard</h1>
    <p class="mb-6">All services are running!</p>
    
    <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="p-4 bg-green-100 rounded">
            <h2 class="font-bold">Backend</h2>
            <p>Port 3000 ✅</p>
            <a href="http://localhost:3000/health" class="text-blue-600">Test</a>
        </div>
        <div class="p-4 bg-green-100 rounded">
            <h2 class="font-bold">Frontend</h2>
            <p>Port 5173 ✅</p>
        </div>
        <div class="p-4 bg-green-100 rounded">
            <h2 class="font-bold">ML Service</h2>
            <p>Port 8000 ✅</p>
            <a href="http://localhost:8000/" class="text-blue-600">Test</a>
        </div>
        <div class="p-4 bg-green-100 rounded">
            <h2 class="font-bold">Redis</h2>
            <p>Port 6380 ✅</p>
        </div>
    </div>
    
    <p>Go to <a href="/" class="text-blue-600">SvelteKit dashboard</a> for full interface.</p>
</body>
</html>

# ============================================
# CFP Backend - Main Server Configuration
# ============================================

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name cfp.example.com;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cfp.example.com;
    
    # SSL certificates
    ssl_certificate /etc/nginx/ssl/cfp.crt;
    ssl_certificate_key /etc/nginx/ssl/cfp.key;
    
    # SSL stapling
    ssl_trusted_certificate /etc/nginx/ssl/ca.crt;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none';" always;
    
    # Root directory
    root /var/www/html;
    index index.html;
    
    # API endpoints
    location /api/ {
        # Rate limiting
        limit_req zone=api burst=20 nodelay;
        
        # Proxy to backend
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # CORS headers
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    }
    
    # Authentication endpoints (stricter rate limiting)
    location /api/auth/ {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://backend:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Metrics endpoint (internal only)
    location /metrics {
        internal;
        proxy_pass http://backend:8080/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # File uploads
    location /uploads/ {
        alias /data/uploads/;
        
        # Security
        internal;
        
        # Caching
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # File serving optimizations
        sendfile on;
        tcp_nopush on;
    }
    
    # Static files
    location /static/ {
        alias /app/static/;
        
        # Caching
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Gzip
        gzip_static on;
        gunzip on;
    }
    
    # Documentation
    location /docs/ {
        alias /app/docs/;
        
        # Basic authentication
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
    
    # Error pages
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to sensitive files
    location ~* \.(sql|db|log|ini|conf|sh|key)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Admin subdomain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.cfp.example.com;
    
    # SSL certificates
    ssl_certificate /etc/nginx/ssl/cfp.crt;
    ssl_certificate_key /etc/nginx/ssl/cfp.key;
    
    # Basic authentication
    auth_basic "Administration Area";
    auth_basic_user_file /etc/nginx/.htpasswd-admin;
    
    location / {
        proxy_pass http://backend:8080/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

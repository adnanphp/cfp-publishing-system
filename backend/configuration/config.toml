# ============================================
# Cargo Configuration
# ============================================
# Project-specific cargo configuration
# This file overrides user-global cargo settings

# ============ BUILD CONFIGURATION ============
[build]
# Parallel compilation
jobs = 8  # Number of parallel jobs, set to CPU count

# Target directory (optional)
# target-dir = "target"

# Build script output directory
# out-dir = "build"

# Incremental compilation (development only)
incremental = true

# ============ PROFILE CONFIGURATIONS ============
[profile.dev]
# Development profile settings
opt-level = 0      # No optimizations for faster compile times
debug = true       # Include debug information
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 16  # Parallel code generation for faster builds
incremental = true
rpath = false

[profile.release]
# Release profile settings
opt-level = 3      # Maximum optimizations
debug = false      # No debug info (smaller binaries)
debug-assertions = false
overflow-checks = false
lto = true         # Link-time optimization
codegen-units = 1  # Single codegen unit for better optimization
panic = 'abort'    # Abort on panic (no unwinding)
strip = true       # Strip symbols from binary
# incremental = false  # Disable incremental for release

[profile.test]
# Test profile (inherits from dev)
opt-level = 0
debug = 2
debug-assertions = true
overflow-checks = true

[profile.bench]
# Benchmark profile (inherits from release)
opt-level = 3
debug = false
lto = true
codegen-units = 1

# ============ NETWORK CONFIGURATION ============
[net]
# Network settings
retry = 3
git-fetch-with-cli = true  # Use git CLI for git operations

# ============ TARGET CONFIGURATIONS ============
[target.x86_64-unknown-linux-gnu]
# Linux target configuration
linker = "clang"  # Use clang as linker (faster than gcc)

[target.x86_64-pc-windows-msvc]
# Windows target configuration
linker = "link.exe"

[target.x86_64-apple-darwin]
# macOS target configuration
linker = "cc"
ar = "ar"

# ============ INSTALL CONFIGURATION ============
[install]
# Cargo install settings
prefix = "~/.cargo"
root = "/usr/local"

# ============ FUTURE INCOMPATIBILITY REPORTING ============
# Enable future incompatibility reports
[future-incompat-report]
frequency = 'always'

# ============ ALIASES ============
# Custom cargo aliases
[alias]
# Shortcuts for common commands
b = "build"
c = "check"
t = "test"
r = "run"
rr = "run --release"
doc = "doc --open"
fmt = "fmt --all"
clippy = "clippy --all-targets --all-features -- -D warnings"
fix = "fix --allow-dirty --allow-staged"
audit = "audit"
tree = "tree"
outdated = "outdated"

# Development workflow aliases
dev = "run --"
test-all = "test --all-features --all-targets"
lint = "clippy && fmt -- --check"
ci = "test-all && lint"
prep = "fmt && clippy"
clean-all = "clean && rm -rf target"

# Database migration aliases
migrate = "sqlx migrate run"
migrate-new = "sqlx migrate add"
migrate-revert = "sqlx migrate revert"

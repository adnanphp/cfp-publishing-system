[package]
name = "cfp-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cfp-backend"
path = "src/main.rs"

[dependencies]
actix-web = "4.0"
actix-cors = "0.7"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "bigdecimal"] }
serde = { version = "1.0.229", features = ["derive"] }
dotenvy = "0.15.7"
uuid = { version = "1.25.0", features = ["v4"] }
anyhow = "1.0.104"
thiserror = "2.0.20"
env_logger = "0.11.11"
futures = "0.3.34"

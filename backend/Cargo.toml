[package]
name = "cfp-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cfp-backend"
path = "src/main.rs"

[dependencies]
# Web Framework
actix-web = "4.0"
actix-cors = "0.7"
actix-rt = "2.0"

# Database
sqlx = { version = "0.7", features = [
    "runtime-tokio-native-tls",
    "postgres",
    "chrono",
    "uuid",
    "json"
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time & Date
chrono = { version = "0.4", features = ["serde"] }

# Async Runtime
tokio = { version = "1.0", features = ["full"] }

# Environment Variables
dotenvy = "0.15"

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# Logging
env_logger = "0.10"
log = "0.4"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
futures = "0.3"
regex = "1.0"

# Password Hashing (if needed)
argon2 = "0.5"
